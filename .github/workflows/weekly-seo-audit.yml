name: Weekly SEO Reminder

# This workflow used to fabricate a canned "no critical issues" report
# every week and auto-commit it to whatever branch triggered it, with no
# review and no real audit behind the claims. That's the exact anti-pattern
# skill-staleness-check.yml was built to avoid — flagged directly to the
# user rather than left in place. Fixed the same way: this workflow makes
# no claims about your site's SEO state at all now. It opens a reminder
# issue prompting a human to actually run the seo-audit skill against
# their real site this week, and never writes to any file.
#
# This repo can't run a real, generic SEO audit on a schedule for every
# downstream user — that needs each user's own site URL and (for anything
# beyond a basic crawl) their own API keys for tools like Ahrefs or
# Semrush, which this public template repo has no way to hold on anyone's
# behalf. A reminder is the honest version of "weekly SEO audit" this
# workflow can actually deliver without inventing findings.

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday, 8am UTC
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Find existing weekly reminder issue
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list --repo "${{ github.repository }}" \
            --search "Weekly SEO audit reminder in:title" --state open \
            --json number,title --jq '.[] | select(.title == "Weekly SEO audit reminder") | .number' | head -1)
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the reminder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf '%s\n\n%s' \
            "This week's nudge to actually run \`seo-audit\` (and, if relevant, \`ai-seo\`) against your real site — this workflow doesn't run an audit itself or know anything about your site's current state; see the note at the top of this workflow's YAML for why." \
            "Close this issue once you've run it, or leave it — it'll be replaced by next Monday's reminder either way, not duplicated.")

          if [ -n "${{ steps.find.outputs.number }}" ]; then
            gh issue comment "${{ steps.find.outputs.number }}" --body "$BODY"
          else
            gh issue create --title "Weekly SEO audit reminder" --body "$BODY"
          fi
